name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, dev]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements-dev.txt ruff

      - name: Lint (ruff, errors only)
        run: ruff check api functions model --select F,E9

      - name: Run API unit tests
        run: |
          cp model/model_v1.0.0.pkl api/
          cd api
          MODEL_PATH=model_v1.0.0.pkl pytest -q

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Validate the multi-stage image builds
        run: |
          cp model/model_v1.0.0.pkl api/
          docker build -t wine-api:ci ./api
